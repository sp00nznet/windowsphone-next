# GitLab CI/CD Pipeline for Windows Phone Next
# Builds the entire platform using Windows shell runner

stages:
  - build
  - package

variables:
  CONFIGURATION: Release
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_VERSION: "8.0"
  DOTNET_INSTALL_DIR: "$CI_PROJECT_DIR\\.dotnet"

# Reusable script to ensure .NET SDK is available
.install_dotnet: &install_dotnet
  - |
    # Check if dotnet is available in PATH
    $dotnetPath = Get-Command dotnet -ErrorAction SilentlyContinue
    if ($dotnetPath) {
      Write-Host "Using system .NET SDK"
      dotnet --version
    } else {
      Write-Host "Installing .NET SDK ${env:DOTNET_VERSION}..."

      # Create install directory
      New-Item -ItemType Directory -Force -Path $env:DOTNET_INSTALL_DIR | Out-Null

      # Download and run the official install script
      $installScript = "$env:TEMP\dotnet-install.ps1"
      Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installScript

      # Install .NET SDK
      & $installScript -Channel $env:DOTNET_VERSION -InstallDir $env:DOTNET_INSTALL_DIR

      # Add to PATH for this session
      $env:PATH = "$env:DOTNET_INSTALL_DIR;$env:PATH"

      Write-Host "Installed .NET SDK:"
      dotnet --version
    }

# Build all applications
build:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - *install_dotnet
    - Write-Host "Building Windows Phone Next Platform"
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration $env:CONFIGURATION -Clean
  artifacts:
    paths:
      - Apps/**/bin/$CONFIGURATION/net8.0-windows/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_MERGE_REQUEST_ID
      when: never

# Create distribution package
package:
  stage: package
  tags:
    - windows
    - shell
  dependencies:
    - build
  before_script:
    - *install_dotnet
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration $env:CONFIGURATION
    - Write-Host "Distribution package created in Dist folder"
  artifacts:
    name: "windowsphone-next-$CI_COMMIT_SHORT_SHA"
    paths:
      - Dist/
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build for merge requests (faster feedback)
build:mr:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - *install_dotnet
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration Debug
  rules:
    - if: $CI_MERGE_REQUEST_ID
  allow_failure: false
