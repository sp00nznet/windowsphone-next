# GitLab CI/CD Pipeline for Windows Phone Next
# Builds the entire platform using Windows shell runner

stages:
  - build
  - package

variables:
  CONFIGURATION: Release
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# Build all applications
build:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - dotnet --version
    - Write-Host "Building Windows Phone Next Platform"
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration $env:CONFIGURATION -Clean
  artifacts:
    paths:
      - Apps/**/bin/$CONFIGURATION/net8.0-windows/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_ID

# Create distribution package
package:
  stage: package
  tags:
    - windows
    - shell
  dependencies:
    - build
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration $env:CONFIGURATION
    - Write-Host "Distribution package created in Dist folder"
  artifacts:
    name: "windowsphone-next-$CI_COMMIT_SHORT_SHA"
    paths:
      - Dist/
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build for merge requests (faster feedback)
build:mr:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - dotnet --version
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration Debug
  rules:
    - if: $CI_MERGE_REQUEST_ID
  allow_failure: false
