# GitLab CI/CD Pipeline for Windows Phone Next
# Builds the entire platform using Windows shell runner

stages:
  - build
  - package
  - deploy

variables:
  CONFIGURATION: Release
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_VERSION: "8.0"
  # Install outside project directory to avoid Git cleanup issues
  DOTNET_INSTALL_DIR: "C:\\gitlab-dotnet-sdk"
  # Exclude .dotnet from Git clean to avoid locked file issues
  GIT_CLEAN_FLAGS: -ffdx -e .dotnet/

# Kill any lingering compiler processes that may hold file locks
.cleanup_locks: &cleanup_locks
  - Write-Host "Starting cleanup..."
  - 'Get-Process -Name "VBCSCompiler" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; $true'
  - 'Get-Process -Name "dotnet" -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -lt (Get-Date).AddMinutes(-5) } | Stop-Process -Force -ErrorAction SilentlyContinue; $true'
  - Write-Host "Cleanup complete"

# Reusable script to ensure .NET SDK is available
.install_dotnet: &install_dotnet
  - |
    # Check if dotnet is available in PATH
    $dotnetPath = Get-Command dotnet -ErrorAction SilentlyContinue
    if ($dotnetPath) {
      Write-Host "Using system .NET SDK"
      dotnet --version
    } else {
      # Check if we have a cached installation
      $cachedDotnet = Join-Path $env:DOTNET_INSTALL_DIR "dotnet.exe"
      if (Test-Path $cachedDotnet) {
        Write-Host "Using cached .NET SDK from $env:DOTNET_INSTALL_DIR"
        $env:PATH = "$env:DOTNET_INSTALL_DIR;$env:PATH"
        dotnet --version
      } else {
        Write-Host "Installing .NET SDK ${env:DOTNET_VERSION}..."

        # Create install directory
        New-Item -ItemType Directory -Force -Path $env:DOTNET_INSTALL_DIR | Out-Null

        # Download and run the official install script
        $installScript = "$env:TEMP\dotnet-install.ps1"
        Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installScript

        # Install .NET SDK
        & $installScript -Channel $env:DOTNET_VERSION -InstallDir $env:DOTNET_INSTALL_DIR

        # Add to PATH for this session
        $env:PATH = "$env:DOTNET_INSTALL_DIR;$env:PATH"

        Write-Host "Installed .NET SDK:"
        dotnet --version
      }
    }

# Build all applications
build:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - *cleanup_locks
    - *install_dotnet
    - Write-Host "Building Windows Phone Next Platform"
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration $env:CONFIGURATION -Clean
  artifacts:
    paths:
      - Apps/**/bin/$CONFIGURATION/net8.0-windows/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_MERGE_REQUEST_ID
      when: never

# Create distribution package
package:
  stage: package
  tags:
    - windows
    - shell
  dependencies:
    - build
  before_script:
    - *cleanup_locks
    - *install_dotnet
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration $env:CONFIGURATION
    - Write-Host "Distribution zip package created"
  artifacts:
    name: "windowsphone-next-$CI_COMMIT_SHORT_SHA"
    paths:
      - WindowsPhoneNext.zip
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build for merge requests (faster feedback)
build:mr:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - *cleanup_locks
    - *install_dotnet
  script:
    - powershell -ExecutionPolicy Bypass -File .\Build.ps1 -Configuration Debug
  rules:
    - if: $CI_MERGE_REQUEST_ID
  allow_failure: false

# Deploy releases to shared storage
deploy:
  stage: deploy
  tags:
    - windows
    - shell
  dependencies:
    - package
  script:
    - Write-Host "Cleaning up any existing drive mapping..."
    - 'net use R: /delete 2>$null; $true'
    - Write-Host "Mapping network drive..."
    - 'net use R: "\\192.168.100.22\releases" gitlab /user:root'
    - Write-Host "Creating directory R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME"
    - 'New-Item -ItemType Directory -Force -Path "R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME"'
    - Write-Host "Copying zip file..."
    - 'Copy-Item -Force WindowsPhoneNext.zip "R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME\"'
    - Write-Host "Unmapping network drive..."
    - 'net use R: /delete'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
